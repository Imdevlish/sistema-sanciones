<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Acceso - Supabase</title>
    <!-- Carga de la versión de Supabase compatible con las nuevas llaves Publishable -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #fff; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #4338ca; }
        .toggle-link {
            margin-top: 15px;
            display: block;
            color: #818cf8;
            cursor: pointer;
            font-size: 14px;
        }
        .toggle-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 id="authTitle">🔑 Iniciar Sesión</h2>
        <input type="email" id="email" placeholder="Correo Electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button id="btnAuthSubmit" onclick="handleAuth()">Ingresar</button>
        <span class="toggle-link" onclick="toggleAuthMode()">¿No tienes cuenta? Regístrate</span>
    </div>

    <script>
        const SUPABASE_URL = "https://jaemlgjyorsoojwmpoxm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_tzjG375c_jiGTkzy0TUF0w_umCH8UAj";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isLogin = true;

        function toggleAuthMode() {
            isLogin = !isLogin;
            document.getElementById('authTitle').innerText = isLogin ? '🔑 Iniciar Sesión' : '📝 Registrarse';
            document.getElementById('btnAuthSubmit').innerText = isLogin ? 'Ingresar' : 'Crear Cuenta';
        }

        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                alert("Por favor completa todos los campos.");
                return;
            }

            try {
                if (isLogin) {
                    const { data, error } = await db.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    alert("¡Inicio de sesión exitoso!");
                    // Aquí puedes redirigir o actualizar la interfaz de usuario
                } else {
                    const { data, error } = await db.auth.signUp({ email, password });
                    if (error) throw error;
                    alert("¡Cuenta creada con éxito! Revisa tu correo si requiere confirmación.");
                }
            } catch (error) {
                alert("Error: " + error.message);
            }
        }
    </script>
</body>
</html>
