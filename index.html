<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Moderación</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #1e1f22;
            --bg-card: #2b2d31;
            --bg-input: #313338;
            --accent: #5865f2;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --border: #3f4147;
            --danger: #da373c;
            --warning: #f0b232;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; }
        .hidden { display: none !important; }
        .auth-container { max-width: 400px; margin: 80px auto; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
        .card { background: var(--bg-card); border-radius: 8px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9em; font-weight: 600; }
        input, select { width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 4px; color: var(--text-main); box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button.btn-sec { background: transparent; border: 1px solid var(--border); }
        .btn-logout { background: var(--danger); width: auto; float: right; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9em; }
        th { background: #2b2d31; color: var(--text-muted); font-size: 0.75em; text-transform: uppercase; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .badge-adv { background: rgba(240, 178, 50, 0.2); color: var(--warning); }
        .badge-san { background: rgba(218, 55, 60, 0.2); color: var(--danger); }
        .notice { text-align: center; padding: 20px; background: #313338; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- LOGIN / REGISTRO -->
    <div id="authScreen" class="card auth-container">
        <h2 id="authTitle">🔑 Iniciar Sesión</h2>
        <form id="authForm">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="authEmail" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="authPassword" required>
            </div>
            <button type="submit" id="btnAuthSubmit">Ingresar</button>
            <button type="button" class="btn-sec" onclick="toggleAuthMode()">¿No tienes cuenta? Regístrate</button>
        </form>
    </div>

    <!-- PENDIENTE DE APROBACIÓN -->
    <div id="pendingScreen" class="card notice hidden" style="max-width: 500px; margin: 80px auto;">
        <h2>⏳ Cuenta en Espera de Aprobación</h2>
        <p>Tu cuenta fue registrada. Un administrador debe otorgarte permisos en Supabase para acceder.</p>
        <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="mainApp" class="hidden">
        <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
        <div style="clear: both; margin-bottom: 15px;"></div>
        <div class="container">
            <div class="card">
                <h2>🛡️ Registrar Sanción</h2>
                <form id="sanctionForm">
                    <div class="form-group"><label>Usuario / Nickname</label><input type="text" id="username" required></div>
                    <div class="form-group">
                        <label>Tipo</label>
                        <select id="type"><option value="Advertencia">Advertencia</option><option value="Sanción">Sanción</option></select>
                    </div>
                    <div class="form-group">
                        <label>Plataforma</label>
                        <select id="platform">
                            <option value="Discord">Discord</option>
                            <option value="Twitch">Twitch</option>
                            <option value="Kick">Kick</option>
                            <option value="YouTube">YouTube</option>
                            <option value="TikTok">TikTok</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Motivo</label>
                        <select id="reason">
                            <option value="Spam / Flood">Spam / Flood</option>
                            <option value="Caps excesivo">Caps excesivo</option>
                            <option value="Insultos leves">Insultos leves</option>
                            <option value="Toxicidad constante">Toxicidad constante</option>
                            <option value="Publicidad no autorizada">Publicidad no autorizada</option>
                            <option value="Acoso dirigido">Acoso dirigido</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Sanción / Tiempo</label>
                        <select id="duration">
                            <option value="Advertencia">Advertencia</option>
                            <option value="Mute 10–30 min">Mute 10–30 min</option>
                            <option value="Mute 1–24 h">Mute 1–24 h</option>
                            <option value="Ban 1–30 días">Ban 1–30 días</option>
                            <option value="Ban permanente">Ban permanente</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Evidencia (URL)</label><input type="url" id="evidence"></div>
                    <button type="submit">Guardar Registro</button>
                </form>
            </div>

            <div class="card">
                <h2>📋 Historial General (Sincronizado)</h2>
                <table>
                    <thead>
                        <tr><th>Código</th><th>Fecha</th><th>Usuario</th><th>Tipo</th><th>Motivo</th><th>Sanción</th><th>Mod</th></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://jaemlgjyorsoojwmpoxm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_tzjGJZ5c_jiGTkzy0IUf0w_umCH8Uaj";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isLogin = true;
    let currentUser = null;

    function toggleAuthMode() {
        isLogin = !isLogin;
        document.getElementById('authTitle').innerText = isLogin ? '🔑 Iniciar Sesión' : '📝 Registrarse';
        document.getElementById('btnAuthSubmit').innerText = isLogin ? 'Ingresar' : 'Crear Cuenta';
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;

        if (isLogin) {
            const { data, error } = await db.auth.signInWithPassword({ email, password });
            if (error) alert("Error al ingresar: " + error.message);
            else checkUserRole();
        } else {
            const { data, error } = await db.auth.signUp({ email, password });
            if (error) alert("Error al registrarse: " + error.message);
            else {
                alert("Cuenta creada con éxito. Un admin deberá aprobar tu cuenta.");
                toggleAuthMode();
            }
        }
    });

    async function checkUserRole() {
        const { data: { user } } = await db.auth.getUser();
        if (!user) {
            showScreen('authScreen');
            return;
        }
        currentUser = user;

        const { data, error } = await db.from('profiles').select('role').eq('id', user.id).single();
        
        if (data && (data.role === 'moderador' || data.role === 'admin')) {
            showScreen('mainApp');
            loadRecords();
        } else {
            showScreen('pendingScreen');
        }
    }

    function showScreen(screenId) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('pendingScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.add('hidden');
        document.getElementById(screenId).classList.remove('hidden');
    }

    async function logout() {
        await db.auth.signOut();
        showScreen('authScreen');
    }

    async function loadRecords() {
        const { data, error } = await db.from('sanciones').select('*').order('id', { ascending: false });
        if (error) return console.error(error);

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        data.forEach(r => {
            const badgeClass = r.tipo === 'Advertencia' ? 'badge-adv' : 'badge-san';
            tbody.innerHTML += `
                <tr>
                    <td><strong>${r.codigo}</strong></td>
                    <td>${new Date(r.fecha).toLocaleDateString()}</td>
                    <td>${r.usuario}</td>
                    <td><span class="badge ${badgeClass}">${r.tipo}</span></td>
                    <td>${r.motivo}</td>
                    <td>${r.duracion}</td>
                    <td>${r.moderador}</td>
                </tr>`;
        });
    }

    document.getElementById('sanctionForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const tipo = document.getElementById('type').value;
        
        const { count } = await db.from('sanciones').select('*', { count: 'exact', head: true }).eq('tipo', tipo);
        const prefix = tipo === 'Advertencia' ? 'ADV' : 'SN';
        const codigo = `${prefix}-${String((count || 0) + 1).padStart(3, '0')}`;

        const payload = {
            codigo,
            usuario: document.getElementById('username').value,
            tipo: tipo,
            plataforma: document.getElementById('platform').value,
            motivo: document.getElementById('reason').value,
            duracion: document.getElementById('duration').value,
            evidencia: document.getElementById('evidence').value,
            moderador: currentUser.email.split('@')[0]
        };

        const { error } = await db.from('sanciones').insert([payload]);
        if (error) alert("Error al guardar: " + error.message);
        else {
            e.target.reset();
            loadRecords();
        }
    });

    checkUserRole();
</script>
</body>
</html>
